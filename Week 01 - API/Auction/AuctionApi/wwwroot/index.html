<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online auction</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main>
        <h1>Online auction</h1>

        <section class="user">
            <label for="bidderName">Your name</label>
            <input
                id="bidderName"
                type="text"
                placeholder="Type your name">
        </section>

        <section>
            <h2>Auctions</h2>

            <div id="message"></div>

            <div id="auctions"></div>
        </section>

        <section class="create-auction">
            <h2>Create a new auction</h2>

            <form id="createAuctionForm">
                <input
                    id="itemName"
                    type="text"
                    placeholder="What are you selling?"
                    required>

                <input
                    id="startingPrice"
                    type="number"
                    min="0"
                    placeholder="Starting price"
                    required>

                <button type="submit">
                    Create auction
                </button>
            </form>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
